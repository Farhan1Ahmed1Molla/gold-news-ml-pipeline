name: Daily Gold Forecast Pipeline

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install yfinance feedparser pandas vaderSentiment scikit-learn

      - name: Run Gold forecast script
        run: python run-pipeline.py

      - name: Save updated forecast_log.csv to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add forecast_log.csv
          git diff --staged --quiet || git commit -m "Auto-update daily gold forecast"
          git push
          
